[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptrader"
version = "0.0.1"
description = "LLM-driven trading agent framework — Python, broker-agnostic, backtest-friendly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "welltilln" },
]
keywords = ["trading", "llm", "ai-agent", "algorithmic-trading", "quant", "backtesting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    # Core: keep slim. Broker/LLM adapters as optional extras.
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ollama = ["ollama>=0.3"]
ccxt = ["ccxt>=4.4"]
nautilus = ["nautilus_trader>=1.200"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/welltilln/promptrader"
Issues = "https://github.com/welltilln/promptrader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptrader"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
